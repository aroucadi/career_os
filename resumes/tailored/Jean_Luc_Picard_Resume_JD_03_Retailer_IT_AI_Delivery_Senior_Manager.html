<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Candidate Name — Tailored Resume (JD 03 Retailer IT AI Delivery Senior Manager)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        @page {
            size: A4;
            margin: 8mm 10mm 8mm 10mm;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 8.5pt;
            line-height: 1.28;
            color: #1e293b;
            background-color: #ffffff;
            -webkit-print-color-adjust: exact;
        }

        .header {
            text-align: center;
            border-bottom: 1.5pt solid #0f172a;
            padding-bottom: 3px;
            margin-bottom: 6px;
        }

        .candidate-name {
            font-size: 17pt;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: #0f172a;
            text-transform: uppercase;
            margin-bottom: 1px;
        }

        .candidate-title {
            font-size: 9.2pt;
            font-weight: 600;
            color: #2563eb;
            margin-bottom: 2px;
        }

        .contact-info {
            font-size: 8pt;
            color: #475569;
            font-weight: 400;
        }

        .contact-sep {
            margin: 0 4px;
            color: #cbd5e1;
        }

        .section {
            margin-bottom: 6.5px;
            page-break-inside: avoid;
        }

        .section-title {
            font-size: 8.8pt;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #0f172a;
            border-bottom: 1pt solid #cbd5e1;
            padding-bottom: 1.5px;
            margin-bottom: 3.5px;
        }

        .summary-text {
            font-size: 8.4pt;
            color: #334155;
            text-align: justify;
            line-height: 1.30;
        }

        .competencies-list {
            list-style-type: none;
            padding-left: 0;
        }

        .competency-item {
            font-size: 8.2pt;
            color: #334155;
            margin-bottom: 2px;
            line-height: 1.25;
        }

        .competency-item strong {
            color: #0f172a;
            font-weight: 600;
        }

        .job-entry {
            margin-bottom: 5.5px;
            page-break-inside: avoid;
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 1px;
        }

        .job-company {
            font-weight: 700;
            font-size: 8.9pt;
            color: #0f172a;
        }

        .job-location {
            font-size: 8.1pt;
            color: #64748b;
            font-weight: 400;
        }

        .job-sub {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 2.5px;
        }

        .job-title {
            font-weight: 600;
            font-size: 8.4pt;
            color: #2563eb;
        }

        .job-dates {
            font-size: 8pt;
            color: #64748b;
            font-style: italic;
        }

        .bullet-list {
            list-style-type: none;
            padding-left: 0;
        }

        .bullet-item {
            position: relative;
            padding-left: 11px;
            margin-bottom: 2px;
            font-size: 8.1pt;
            color: #334155;
            text-align: justify;
            line-height: 1.25;
        }

        .bullet-item::before {
            content: "•";
            position: absolute;
            left: 2px;
            color: #2563eb;
            font-weight: bold;
        }

        .bullet-item strong {
            color: #0f172a;
            font-weight: 600;
        }

        .job-env {
            font-size: 7.8pt;
            color: #64748b;
            margin-top: 2px;
            margin-bottom: 3px;
        }

        .job-env strong {
            color: #475569;
        }

        .cert-item {
            font-size: 8.1pt;
            color: #334155;
            margin-bottom: 1.5px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="candidate-name">Candidate Name</div>
        <div class="candidate-title">Strategic Professional</div>
        <div class="contact-info">
            
        </div>
    </div>

    
</body>
</html>
